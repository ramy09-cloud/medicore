{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | MediCore</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/tabler-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-brand"><i class="ti ti-heartbeat"></i> MediCore</div>
    <div class="card">
      <div class="card-body p-4">
        <h2 class="h5 text-center mb-4">Sign in to your account</h2>
        {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>
        <p class="text-center mt-3">No account? <a href="{% url 'register' %}">Create one</a></p>
      </div>
    </div>
    <p class="text-center text-muted small">Patient Diagnosis System</p>
  </div>
</div>
</body>
</html>
